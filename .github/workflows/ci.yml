name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Void needs Node 24.22+ or 26.12+.
          node-version: 26
          cache: npm

      # Also runs `void prepare`, which generates the types the next steps need.
      - run: npm ci

      - run: npm test
      - run: npm run typecheck
      - run: npm run build
