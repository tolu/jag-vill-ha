name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the older run pointless. Runs on main
# are never cancelled: one of them may be halfway through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, since a tag can be moved. The comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Void needs Node 24.22+ or 26.12+.
          node-version: 26
          cache: npm

      # Also runs `void prepare`, which generates the types the next steps need.
      - run: npm ci

      - run: npm run format:check
      # Oxlint reports its findings as warnings; the script makes them fail.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # What a page does in the browser. Against the dev server, since /dev/login
  # exists only there. A job of its own, since the ruleset requires `check` by
  # name, and deploy does not wait for it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image, with the browsers and what they need installed.
    # Its version follows @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node comes with the image; this only caches npm's downloads.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - run: node --version && npm ci

      # Starts the dev server on empty data in .void/test-state (webServer in
      # playwright.config.ts). Void applies the migrations as it starts.
      - run: npm run e2e

      # The report holds a trace of each failed attempt, a flaky one too (failed,
      # then passed on retry, and the job green): download it and run
      # `npx playwright show-report <folder>`.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          # A re-run of the job uploads under the same name.
          overwrite: true

  deploy:
    # Only what has landed on main, and only after `check` passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare token lives in this environment, which only main may use.
    environment:
      name: production
      url: https://jagvillha.fyi
    # One deploy at a time, in order: a deploy also applies migrations.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Builds, applies pending migrations and publishes. `.void/project.json`
      # is not committed, so the platform is named here.
      #
      # Void checks Cloudflare's version and deployment lists right after it
      # writes to them, reads once, and stops if they lag behind. It then says
      # "rollback": "not-needed" in its log: production is unchanged and the
      # same deploy goes through a little later. Only then is it tried again.
      #
      # Void's log names the step and the Cloudflare call a deploy stopped at,
      # which its message on screen does not, and is gone with the runner
      # unless it is printed. Steps and status codes only, no secrets.
      - name: Deploy
        run: |
          for attempt in 1 2 3; do
            rm -rf ~/.void/logs
            npx void deploy --platform cloudflare --require-email && exit 0
            echo "::group::Void's log, attempt $attempt"
            cat ~/.void/logs/*.jsonl 2>/dev/null || true
            echo "::endgroup::"
            if [ "$attempt" = 3 ] || ! grep -hs '"msg":"cloudflare_deploy_failed"' ~/.void/logs/*.jsonl | grep -q '"rollback":"not-needed"'; then
              exit 1
            fi
            echo "::warning::Deploy attempt $attempt stopped with production unchanged. Trying again."
            sleep $((attempt * 30))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # An account-owned token cannot look up which account it belongs to.
          # Not a secret: the same id is in void.lock.json.
          CLOUDFLARE_ACCOUNT_ID: 25b5c1e5fa76ec2926c5e103e9662f5d
