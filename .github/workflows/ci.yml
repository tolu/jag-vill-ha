name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the older run pointless. Runs on main
# are never cancelled: one of them may be halfway through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, since a tag can be moved. The comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Void needs Node 24.22+ or 26.12+.
          node-version: 26
          cache: npm

      # Also runs `void prepare`, which generates the types the next steps need.
      - run: npm ci

      - run: npm run format:check
      # Oxlint reports its findings as warnings; the script makes them fail.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # Only what has landed on main, and only after the checks above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare token lives in this environment, which only main may use.
    environment:
      name: production
      url: https://jagvillha.fyi
    # One deploy at a time, in order: a deploy also applies migrations.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Builds, applies pending migrations and publishes. `.void/project.json`
      # is not committed, so the platform is named here.
      #
      # Void checks Cloudflare's version and deployment lists right after it
      # writes to them, reads once, and stops if they lag behind. It then says
      # "rollback": "not-needed" in its log: production is unchanged and the
      # same deploy goes through a little later. Only then is it tried again.
      #
      # Void's log names the step and the Cloudflare call a deploy stopped at,
      # which its message on screen does not, and is gone with the runner
      # unless it is printed. Steps and status codes only, no secrets.
      - name: Deploy
        run: |
          for attempt in 1 2 3; do
            rm -rf ~/.void/logs
            npx void deploy --platform cloudflare --require-email && exit 0
            echo "::group::Void's log, attempt $attempt"
            cat ~/.void/logs/*.jsonl 2>/dev/null || true
            echo "::endgroup::"
            if [ "$attempt" = 3 ] || ! grep -hs '"msg":"cloudflare_deploy_failed"' ~/.void/logs/*.jsonl | grep -q '"rollback":"not-needed"'; then
              exit 1
            fi
            echo "::warning::Deploy attempt $attempt stopped with production unchanged. Trying again."
            sleep $((attempt * 30))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # An account-owned token cannot look up which account it belongs to.
          # Not a secret: the same id is in void.lock.json.
          CLOUDFLARE_ACCOUNT_ID: 25b5c1e5fa76ec2926c5e103e9662f5d
